<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 240" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="tvBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#00A8F3" />
    </linearGradient>
    <linearGradient id="tanukiFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BC6C25" />
      <stop offset="100%" stop-color="#8F4813" />
    </linearGradient>
    <linearGradient id="maskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#382119" />
      <stop offset="100%" stop-color="#23140F" />
    </linearGradient>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00F2FE" flood-opacity="0.25"/>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&amp;display=swap');
      .brand-text {
        font-family: 'Fredoka', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 700;
        fill: #FFFFFF;
      }
      .badge-text {
        font-family: 'Fredoka', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 700;
        fill: #0F172A;
      }
    </style>
  </defs>

  <!-- MASCOT GROUP (Tanuki peeking & perched) -->
  <g id="mascot" transform="translate(68, 30)">
    <!-- Fluffy Striped Tail peeking on the left -->
    <g id="tail" transform="translate(-18, 55)">
      <!-- Tail base -->
      <path d="M-8,30 C-28,15 -35,-8 -25,-22 C-16,-34 2,-30 8,-15 C14,0 4,20 -8,30 Z" fill="#8F4813" />
      <!-- Dark stripes -->
      <path d="M-22,-20 C-15,-29 -2,-27 4,-16 C1,-12 -8,-10 -15,-8 C-19,-11 -21,-16 -22,-20 Z" fill="#382119" />
      <path d="M-27,-5 C-25,-12 -20,-10 -15,-6 C-12,4 -16,10 -22,12 C-26,7 -28,0 -27,-5 Z" fill="#382119" />
      <!-- Tail tip -->
      <circle cx="-24" cy="-21" r="5" fill="#382119" />
    </g>

    <!-- Antenna ears -->
    <!-- Left Antenna -->
    <path d="M18,32 Q12,10 6,4" stroke="#00F2FE" stroke-width="3" stroke-linecap="round" fill="none" />
    <circle cx="6" cy="4" r="4" fill="#00F2FE" />
    <!-- Right Antenna -->
    <path d="M68,32 Q74,10 80,4" stroke="#00F2FE" stroke-width="3" stroke-linecap="round" fill="none" />
    <circle cx="80" cy="4" r="4" fill="#00F2FE" />

    <!-- Left Outer Ear -->
    <path d="M12,42 C8,26 22,20 30,32 Z" fill="#8F4813" />
    <path d="M16,40 C14,30 22,26 26,34 Z" fill="#FFA570" />

    <!-- Right Outer Ear -->
    <path d="M74,42 C78,26 64,20 56,32 Z" fill="#8F4813" />
    <path d="M70,40 C72,30 64,26 60,34 Z" fill="#FFA570" />

    <!-- Head / Face Main Body -->
    <ellipse cx="43" cy="62" rx="36" ry="30" fill="url(#tanukiFur)" />

    <!-- Tanuki Mask Patches (distinctive raccoon dog dark eye surrounds) -->
    <!-- Left Mask Patch -->
    <path d="M15,58 C13,48 28,46 36,54 C40,59 38,70 30,73 C21,75 16,68 15,58 Z" fill="url(#maskGrad)" />
    <!-- Right Mask Patch -->
    <path d="M71,58 C73,48 58,46 50,54 C46,59 48,70 56,73 C65,75 70,68 71,58 Z" fill="url(#maskGrad)" />

    <!-- Light Muzzle & Cheeks Area -->
    <ellipse cx="43" cy="72" rx="20" ry="14" fill="#FFF3E0" />
    <path d="M22,70 C16,70 12,64 16,58 C22,58 26,65 22,70 Z" fill="#FFE0B2" opacity="0.6"/>
    <path d="M64,70 C70,70 74,64 70,58 C64,58 60,65 64,70 Z" fill="#FFE0B2" opacity="0.6"/>

    <!-- Eyes (Cute anime-style glossy eyes) -->
    <!-- Left Eye -->
    <ellipse cx="26" cy="59" rx="5.5" ry="6.5" fill="#111111" />
    <circle cx="24.5" cy="57" r="2.2" fill="#FFFFFF" />
    <circle cx="28" cy="61.5" r="1.1" fill="#FFFFFF" />
    <!-- Right Eye -->
    <ellipse cx="60" cy="59" rx="5.5" ry="6.5" fill="#111111" />
    <circle cx="58.5" cy="57" r="2.2" fill="#FFFFFF" />
    <circle cx="62" cy="61.5" r="1.1" fill="#FFFFFF" />

    <!-- Cute Blush Cheeks -->
    <ellipse cx="16" cy="67" rx="5" ry="3" fill="#FF708F" opacity="0.65" />
    <ellipse cx="70" cy="67" rx="5" ry="3" fill="#FF708F" opacity="0.65" />

    <!-- Nose (Small soft triangle) -->
    <path d="M40.5,67 Q43,65 45.5,67 Q43,71 40.5,67 Z" fill="#2E1C14" />

    <!-- Happy Mouth -->
    <path d="M38,72 Q43,76 48,72" stroke="#2E1C14" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Cute Paws resting on top of the 'T' -->
    <!-- Left Paw -->
    <g id="left-paw" transform="translate(14, 84)">
      <rect x="0" y="0" width="16" height="11" rx="5.5" fill="#FFF3E0" />
      <path d="M5,11 L5,7 M11,11 L11,7" stroke="#DDB892" stroke-width="1.5" stroke-linecap="round" />
    </g>
    <!-- Right Paw -->
    <g id="right-paw" transform="translate(56, 84)">
      <rect x="0" y="0" width="16" height="11" rx="5.5" fill="#FFF3E0" />
      <path d="M5,11 L5,7 M11,11 L11,7" stroke="#DDB892" stroke-width="1.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- TYPOGRAPHY: "Tanuki" -->
  <text x="76" y="196" font-size="104" class="brand-text" letter-spacing="1">Tanuki</text>

  <!-- STREAMING BADGE: "▶ TV" -->
  <g id="tv-badge" transform="translate(488, 114)" filter="url(#badgeGlow)">
    <!-- TV Screen Pill Shape -->
    <rect x="0" y="0" width="220" height="88" rx="28" fill="url(#tvBadgeGrad)" />

    <!-- Inner bezel highlight line for subtle tech screen feel -->
    <rect x="4" y="4" width="212" height="80" rx="24" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.4" />

    <!-- Play Icon Triangle -->
    <path d="M36,28 L62,44 L36,60 Z" fill="#0F172A" />

    <!-- "TV" Text -->
    <text x="78" y="58" font-size="52" class="badge-text" letter-spacing="3">TV</text>

    <!-- Subtle Antenna on TV Badge -->
    <path d="M165,0 Q175,-16 190,-22" stroke="#00F2FE" stroke-width="3" stroke-linecap="round" fill="none" />
    <circle cx="190" cy="-22" r="3.5" fill="#00F2FE" />
    <path d="M152,0 Q145,-14 135,-18" stroke="#00F2FE" stroke-width="3" stroke-linecap="round" fill="none" />
    <circle cx="135" cy="-18" r="3.5" fill="#00F2FE" />
  </g>
</svg>
